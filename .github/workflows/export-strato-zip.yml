name: Export STRATO site ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare upload package
        shell: bash
        run: |
          mkdir -p site-package
          cp index.html reinigung.html sanierung.html styles.css app.js robots.txt _headers site-package/
          cp -R assets site-package/

      - name: Upload site package
        uses: actions/upload-artifact@v4
        with:
          name: kai-strato-site
          path: site-package/
          if-no-files-found: error
          retention-days: 7
